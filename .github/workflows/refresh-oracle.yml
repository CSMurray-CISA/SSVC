name: Refresh vendor security data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Test vendor parsers
        run: python3 -m unittest discover -s tests
      - name: Download current Oracle CPU and CSPU data
        run: python3 scripts/update_oracle.py
      - name: Download current vendor advisories and CISA KEV data
        run: python3 scripts/update_vendors.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- oracle-data vendor-data; then
            echo "Vendor data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oracle-data vendor-data
          git commit -m "Refresh vendor security advisory data"
          git push
