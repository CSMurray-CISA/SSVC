name: Refresh Oracle security data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current Oracle CPU and CSPU data
        run: python3 scripts/update_oracle.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- oracle-data; then
            echo "Oracle data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oracle-data
          git commit -m "Refresh Oracle security advisory data"
          git push
