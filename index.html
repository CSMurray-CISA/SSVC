<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Microsoft &amp; Oracle SSVC Scoring Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #111; --surface: #fafafa; --hover: #f6faff;
    --border: #ddd; --muted: #666;
    --sev-critical: #b00020; --sev-high: #d93025; --sev-medium: #f9ab00;
    --sev-low: #34a853; --sev-unknown: #9aa0a6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --fg: #e8eaed; --surface: #11161c; --hover: #18202a;
      --border: #2b2f36; --muted: #9aa0a6;
    }
  }
  html[data-theme="light"] {
    --bg:#fff; --fg:#111; --surface:#fafafa; --hover:#f6faff; --border:#ddd; --muted:#666;
  }
  html[data-theme="dark"] {
    --bg:#0b0f14; --fg:#e8eaed; --surface:#11161c; --hover:#18202a; --border:#2b2f36; --muted:#9aa0a6;
  }
  body { font-family:system-ui,Arial; margin:16px; background:var(--bg); color:var(--fg); }
  h1 { font-size:20px; margin:0 0 12px; }
  .grid { display:grid; gap:8px; }
  .inputs { display:grid; gap:8px; grid-template-columns:repeat(2,minmax(220px,1fr)); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, select, button {
    font:inherit; padding:6px 8px; background:var(--surface); color:var(--fg);
    border:1px solid var(--border); border-radius:4px;
  }
  .badge { padding:2px 8px; border-radius:10px; font-size:12px; }
  .CRITICAL { background:var(--sev-critical); color:#fff; }
  .HIGH { background:var(--sev-high); color:#fff; }
  .MEDIUM { background:var(--sev-medium); color:#111; }
  .LOW { background:var(--sev-low); color:#111; }
  .UNKNOWN { background:var(--sev-unknown); color:#111; }
  .TOTAL { background:#7b1fa2; color:#fff; }
  .PARTIAL { background:#5c6bc0; color:#fff; }
  .YES { background:#1565c0; color:#fff; }
  .NO { background:#546e7a; color:#fff; }
  .VARIES { background:#00897b; color:#fff; }
  .NONE { background:#607d8b; color:#fff; }
  .POC { background:#f9a825; color:#111; }
  .ACTIVE { background:#c62828; color:#fff; }
  .table-wrap { margin-top:10px; overflow:auto; border:1px solid var(--border); border-radius:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:top; }
  th { position:sticky; top:0; background:var(--surface); cursor:pointer; z-index:1; }
  tr:hover { background:var(--hover); }
  tr.main-row { cursor:pointer; }
  tr.main-row.open { background:var(--hover); }
  .cve-link { color:inherit; font-weight:600; text-decoration:underline; }
  .muted { color:var(--muted); }
  .detail { white-space:normal; }
  .detail-grid { display:grid; grid-template-columns:180px 1fr; gap:6px 12px; }
  .detail-grid b { color:var(--muted); font-weight:600; }
  .detail pre {
    margin:8px 0 0; padding:10px; overflow:auto; max-height:420px;
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    white-space:pre-wrap; word-break:break-word;
  }
  .vector { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .vendor-tabs { display:flex; gap:6px; margin-bottom:12px; }
  .vendor-tab { border-radius:999px; padding:7px 14px; }
  .vendor-tab[aria-selected="true"] { background:#1565c0; color:#fff; border-color:#1565c0; }
  .hidden { display:none !important; }
  .source-note { font-size:12px; }
  .source-note a { color:inherit; }
  @media (max-width:700px) { .inputs { grid-template-columns:1fr; } }
</style>
</head>
<body>
<h1 id="pageTitle">Microsoft Patch Tuesday Pre-Release Dashboard</h1>
<div class="vendor-tabs" role="tablist" aria-label="Vendor">
  <button class="vendor-tab" id="microsoftTab" role="tab" aria-selected="true">Microsoft</button>
  <button class="vendor-tab" id="oracleTab" role="tab" aria-selected="false">Oracle</button>
</div>
<div class="grid">
  <div class="inputs" id="microsoftInputs">
    <label>
      <strong>CVRF JSON</strong><br/>
      <input id="cvrf" type="file" accept=".json" />
    </label>
  </div>
  <div class="inputs hidden" id="oracleInputs">
    <label>
      <strong>Oracle release</strong><br/>
      <select id="oracleRelease" disabled><option>Loading releases…</option></select>
    </label>
    <label>
      <strong>Product family</strong><br/>
      <select id="oracleProduct" disabled><option value="">All products</option></select>
    </label>
    <div class="source-note muted">
      Releases are refreshed automatically from Oracle's official CPU/CSPU advisories.
      <a id="oracleSource" href="https://www.oracle.com/security-alerts/" target="_blank" rel="noopener">View source</a>
    </div>
  </div>
  <div class="controls">
    <button id="loadBtn">Load</button>
    <button id="exportCsvBtn" disabled>Export CSV</button>
    <button id="exportXlsBtn" disabled>Export Excel</button>
    <button id="exportJsonBtn" disabled>Export JSON</button>
    <button id="copyBtn" disabled>Copy rows</button>
    <label>Theme:
      <select id="theme">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <span id="msg" class="muted"></span>
  </div>
  <div class="controls">
    <input id="q" type="search" placeholder="Filter (CVE, Description, Vector…)" />
    <label>Severity:
      <select id="sev">
        <option value="">All</option>
        <option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>UNKNOWN</option>
      </select>
    </label>
    <label>Impact:
      <select id="imp">
        <option value="">All</option>
        <option>Total</option><option>Partial</option><option>Unknown</option>
      </select>
    </label>
    <label>Automatable:
      <select id="auto">
        <option value="">All</option>
        <option>Yes</option><option>No</option><option>Unknown</option>
      </select>
    </label>
    <label>Exploitation:
      <select id="expl">
        <option value="">All</option>
        <option>none</option><option>poc</option><option>active</option>
      </select>
    </label>
    <label>Internet Exposed:
      <select id="iex">
        <option value="">All</option>
        <option>Yes</option><option>No</option><option>Varies</option><option>Unknown</option>
      </select>
    </label>
  </div>
  <div class="table-wrap">
    <table id="grid"><thead></thead><tbody></tbody></table>
  </div>
  <div class="muted" id="stats"></div>
</div>
<script>
(function() {
  const sel = document.getElementById("theme");
  const saved = localStorage.getItem("theme") || "auto";
  sel.value = saved;
  applyTheme(saved);
  sel.onchange = () => { localStorage.setItem("theme", sel.value); applyTheme(sel.value); };
  function applyTheme(t) {
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }
})();

const COLS = [
  "CVE-ID","Description","CVSS Vector","CVSS","Severity","Impact",
  "Automatable","Exploitation","Internet Exposed"
];
let rows = [], filtered = [], sortCol = "CVSS", sortDir = -1, openCve = null;
let activeVendor = "microsoft", oracleManifest = null;
const vendorRows = { microsoft: [], oracle: [] };
const $ = s => document.querySelector(s);
const $head = $("#grid thead"), $body = $("#grid tbody");

$("#loadBtn").onclick = loadFiles;
$("#microsoftTab").onclick = () => switchVendor("microsoft");
$("#oracleTab").onclick = () => switchVendor("oracle");
$("#oracleRelease").onchange = loadOracleRelease;
$("#oracleProduct").onchange = applyFilters;
["#q","#sev","#imp","#auto","#expl","#iex"].forEach(id => {
  const el = $(id);
  el.oninput = el.onchange = applyFilters;
});
$("#exportCsvBtn").onclick = () => dlCSV(filtered);
$("#exportJsonBtn").onclick = () => dlJSON(filtered);
$("#exportXlsBtn").onclick = () => dlXLS(filtered);
$("#copyBtn").onclick = () => navigator.clipboard.writeText(toCSV(filtered));

function readText(f) {
  return new Promise(res => {
    if (!f) return res(null);
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsText(f);
  });
}
function parseCSV(txt) {
  if (!txt) return [];
  const lines = txt.split(/\r?\n/).filter(x => x.trim());
  const split = line => {
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (ch === "," && !q) { out.push(cur); cur = ""; }
      else cur += ch;
    }
    out.push(cur); return out.map(s => s.trim());
  };
  const head = split(lines[0]);
  return lines.slice(1).map(line => {
    const vals = split(line), o = {};
    head.forEach((h, i) => o[h] = vals[i] || "");
    return o;
  });
}
function parseVector(vec) {
  const m = {};
  if (!vec) return m;
  String(vec).split("/").forEach(part => {
    const i = part.indexOf(":");
    if (i > 0) m[part.slice(0, i).replace(/^CVSS:\d+(\.\d+)?$/, "").trim()] = part.slice(i+1).trim();
  });
  return m;
}
function pickCVSS(sets) {
  if (!Array.isArray(sets) || !sets.length) return { base: "", vector: "", metrics: {} };
  const ranked = sets.map(s => {
    const ver = String(s.Version || "").trim();
    const base = parseFloat(s.BaseScore) || 0;
    const vector = s.Vector || s.VectorString || "";
    const pri = { "4.0":4,"3.1":3,"3.0":2,"2.0":1 }[ver] ||
      (String(vector).includes("4.0") ? 4 : String(vector).includes("3.1") ? 3 : 0);
    return { ver, base, pri, vector };
  }).sort((a,b)=>(b.pri-a.pri)||(b.base-a.base));
  const top = ranked[0];
  return { base: top.base ? top.base.toFixed(1) : "", vector: top.vector, metrics: parseVector(top.vector) };
}
function severity(score) {
  score = parseFloat(score);
  if (isNaN(score)) return "UNKNOWN";
  if (score >= 9) return "CRITICAL";
  if (score >= 7) return "HIGH";
  if (score >= 4) return "MEDIUM";
  return "LOW";
}

/* Impact from CIA only:
   C:H AND I:H → Total
   C:N I:N A:H (DoS) → Partial
   any other High/Low/None mix → Partial */
function deriveImpact(metrics) {
  const C = metrics.C || metrics.VC || "";
  const I = metrics.I || metrics.VI || "";
  const A = metrics.A || metrics.VA || "";
  if (!C && !I && !A) return "Unknown";
  if (C === "H" && I === "H") return "Total";
  return "Partial";
}
function deriveAutomatable(metrics) {
  const AV = metrics.AV || "", AC = metrics.AC || "";
  const PR = metrics.PR || metrics.Au || "", UI = metrics.UI || "";
  if (!AV && !AC && !PR && !UI) return "Unknown";
  return (AV === "N" && (!AC || AC === "L") &&
          (PR === "N" || PR === "NONE" || PR === "") &&
          (UI === "N" || UI === "NONE" || UI === "")) ? "Yes" : "No";
}
function deriveInternetExposed(metrics) {
  const AV = metrics.AV || "";
  if (AV === "N") return "Yes";
  if (AV === "A") return "Varies";
  if (AV === "L" || AV === "P") return "No";
  return "Unknown";
}
function parseExploitStatus(v) {
  const blobs = [];
  (v.Threats || []).forEach(t => {
    const desc = String(t.Description?.Value || t.Description || "");
    if (t.Type === 1 || t.Type === "1" || /Publicly Disclosed:/i.test(desc) || /Exploited:/i.test(desc)) blobs.push(desc);
  });
  (v.Notes || []).forEach(n => blobs.push(String(n.Value || "")));
  const raw = blobs.join("; ");
  const kv = {};
  raw.split(/[;\n]/).forEach(part => {
    const i = part.indexOf(":");
    if (i > 0) kv[part.slice(0, i).trim().toLowerCase()] = part.slice(i + 1).trim().toLowerCase();
  });
  if (kv.exploited === "yes" || /exploitation detected/i.test(raw)) return "active";
  if (kv["publicly disclosed"] === "yes") return "poc";
  if (/\b(exploited in the wild|zero-?day|in[- ]the[- ]wild)\b/i.test(raw)) return "active";
  return "none";
}
function val(x) {
  if (x == null) return "";
  if (typeof x === "string" || typeof x === "number") return String(x);
  if (Array.isArray(x)) return x.map(val).filter(Boolean).join(", ");
  if (typeof x === "object") {
    if (x.Value != null) return String(x.Value);
    if (x.Title != null && x.Value == null) return val(x.Title);
  }
  return "";
}
function parseCVRF(json) {
  const vulns = json.Vulnerability || json.Document?.Vulnerability || [];
  return vulns.map(v => {
    const cve = Array.isArray(v.CVE) ? v.CVE[0] : (v.CVE || "");
    const cv = pickCVSS(v.CVSSScoreSets || []);
    return {
      "CVE-ID": cve,
      "Description": val(v.Title),
      "CVSS Vector": cv.vector || "",
      "CVSS": cv.base || "",
      "Severity": severity(cv.base),
      "Impact": deriveImpact(cv.metrics),
      "Automatable": deriveAutomatable(cv.metrics),
      "Exploitation": parseExploitStatus(v),
      "Internet Exposed": deriveInternetExposed(cv.metrics),
      _metrics: cv.metrics,
      _raw: v
    };
  });
}
function walkOracleProducts(branches, parents = [], map = new Map()) {
  (branches || []).forEach(branch => {
    const next = branch.name ? parents.concat(branch.name) : parents;
    if (branch.product?.product_id) {
      map.set(branch.product.product_id, {
        name: branch.product.name || branch.name || branch.product.product_id
      });
    }
    walkOracleProducts(branch.branches, next, map);
  });
  return map;
}
function oracleFamilyForProduct(productId, productMap) {
  const info = productMap.get(productId);
  if (!info) return "Other";
  const name = info.name;
  for (const root of (oracleCurrentCsaf?.product_tree?.branches || [])) {
    const stack = [{ branch: root, family: root.name || "Other" }];
    while (stack.length) {
      const { branch, family } = stack.pop();
      if (branch.product?.product_id === productId) return family === "Oracle" ? (branch.name || "Other") : family;
      (branch.branches || []).forEach(child => stack.push({
        branch: child,
        family: branch.category === "vendor" ? (child.name || family) : family
      }));
    }
  }
  return name.split(" Version ")[0] || "Other";
}
let oracleCurrentCsaf = null;
function parseOracleCSAF(json) {
  oracleCurrentCsaf = json;
  const productMap = walkOracleProducts(json.product_tree?.branches || []);
  return (json.vulnerabilities || []).filter(v => (v.product_status?.known_affected || []).length).map(v => {
    const ranked = (v.scores || []).map(s => s.cvss_v4 || s.cvss_v3 || s.cvss_v2).filter(Boolean)
      .sort((a,b) => (parseFloat(b.version) || 0) - (parseFloat(a.version) || 0) || (b.baseScore || 0) - (a.baseScore || 0));
    const score = ranked[0] || {};
    const vector = score.vectorString || "";
    const metrics = parseVector(vector);
    const notes = v.notes || [];
    const fullDescription = notes.find(n => n.category === "description")?.text || notes[0]?.text || "";
    const description = fullDescription.split(/(?<=\.)\s+/)[0] || v.cve || "";
    const ids = v.product_status?.known_affected || [];
    const products = [...new Set(ids.map(id => productMap.get(id)?.name || id))];
    const families = [...new Set(ids.map(id => oracleFamilyForProduct(id, productMap)))].sort();
    return {
      "CVE-ID": v.cve || "",
      "Description": description,
      "CVSS Vector": vector,
      "CVSS": score.baseScore == null ? "" : Number(score.baseScore).toFixed(1),
      "Severity": score.baseSeverity || severity(score.baseScore),
      "Impact": deriveImpact(metrics),
      "Automatable": deriveAutomatable(metrics),
      "Exploitation": "none",
      "Internet Exposed": deriveInternetExposed(metrics),
      _metrics: metrics,
      _products: products,
      _families: families,
      _fullDescription: fullDescription,
      _vendor: "oracle",
      _raw: v
    };
  });
}
function mergeEnrichment(base, recs) {
  const map = new Map();
  for (const r of recs) if (r["CVE-ID"]) map.set(r["CVE-ID"], r);
  base.forEach(b => {
    const m = map.get(b["CVE-ID"]);
    if (!m) return;
    if (m["Internet Exposed"]) b["Internet Exposed"] = m["Internet Exposed"];
    if (m.Exploitation) {
      const e = String(m.Exploitation).toLowerCase();
      b.Exploitation = e === "yes" || e === "active" ? "active" : e === "poc" || e === "public" ? "poc" : e;
    }
  });
  return base;
}
function buildHeader() {
  $head.innerHTML = "";
  const tr = document.createElement("tr");
  COLS.forEach(c => {
    const th = document.createElement("th");
    th.textContent = c;
    th.onclick = () => { sortDir = sortCol === c ? -sortDir : 1; sortCol = c; render(); };
    tr.appendChild(th);
  });
  $head.appendChild(tr);
}
function applyFilters() {
  const q = $("#q").value.toLowerCase();
  const sev = $("#sev").value, imp = $("#imp").value, auto = $("#auto").value;
  const expl = $("#expl").value, ie = $("#iex").value;
  const product = activeVendor === "oracle" ? $("#oracleProduct").value : "";
  filtered = rows.filter(r => {
    if (sev && r.Severity !== sev) return false;
    if (imp && r.Impact !== imp) return false;
    if (auto && r.Automatable !== auto) return false;
    if (expl && r.Exploitation !== expl) return false;
    if (ie && r["Internet Exposed"] !== ie) return false;
    if (product && !(r._families || []).includes(product)) return false;
    if (q) {
      const hay = COLS.map(c => (r[c] || "").toLowerCase()).concat(r._products || [], r._families || []).join("\u0000").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  render();
}
function metricLabel(k, v) {
  const names = {
    AV:"Attack Vector", AC:"Attack Complexity", PR:"Privileges Required",
    UI:"User Interaction", S:"Scope", C:"Confidentiality", I:"Integrity", A:"Availability",
    E:"Exploit Code Maturity", RL:"Remediation Level", RC:"Report Confidence"
  };
  const maps = {
    AV:{N:"Network",A:"Adjacent",L:"Local",P:"Physical"},
    AC:{L:"Low",H:"High"},
    PR:{N:"None",L:"Low",H:"High"},
    UI:{N:"None",R:"Required"},
    S:{U:"Unchanged",C:"Changed"},
    C:{H:"High",L:"Low",N:"None"},
    I:{H:"High",L:"Low",N:"None"},
    A:{H:"High",L:"Low",N:"None"}
  };
  const pretty = (maps[k] && maps[k][v]) || v;
  return `${names[k] || k}: ${pretty}`;
}
function detailHtml(r) {
  if (r._vendor === "oracle") return oracleDetailHtml(r);
  const v = r._raw || {};
  const notes = (v.Notes || []).map(n => {
    const t = val(n.Title) || n.Type || "Note";
    return `<div><b>${escHtml(t)}</b><div>${escHtml(val(n))}</div></div>`;
  }).join("");
  const threats = (v.Threats || []).map(t =>
    `<div><b>Threat ${escHtml(String(t.Type ?? ""))}</b><div>${escHtml(val(t.Description) || JSON.stringify(t))}</div></div>`
  ).join("");
  const rems = (v.Remediations || []).map(t =>
    `<div>${escHtml(val(t.Description) || t.URL || JSON.stringify(t))}</div>`
  ).join("");
  const products = [...new Set((v.ProductStatuses || []).flatMap(p => p.ProductID || []))];
  const m = r._metrics || {};
  const metricBits = Object.keys(m).filter(Boolean).map(k => metricLabel(k, m[k])).join(" · ");
  const cwe = Array.isArray(v.CWE) ? v.CWE : (v.CWE ? [v.CWE] : []);
  return `
    <div class="detail-grid">
      <b>CVE</b><div><a href="https://msrc.microsoft.com/update-guide/vulnerability/${encodeURIComponent(r["CVE-ID"])}" target="_blank" rel="noopener">${escHtml(r["CVE-ID"])}</a>
        · <a href="https://nvd.nist.gov/vuln/detail/${encodeURIComponent(r["CVE-ID"])}" target="_blank" rel="noopener">NVD</a></div>
      <b>Title</b><div>${escHtml(r.Description)}</div>
      <b>CVSS</b><div>${escHtml(r.CVSS)} — <span class="vector">${escHtml(r["CVSS Vector"])}</span></div>
      <b>Metrics</b><div>${escHtml(metricBits || "Not provided")}</div>
      <b>Impact / Auto / Expl</b><div>${escHtml(r.Impact)} · Automatable ${escHtml(r.Automatable)} · Exploitation ${escHtml(r.Exploitation)} · Internet ${escHtml(r["Internet Exposed"])}</div>
      <b>CWE</b><div>${escHtml(cwe.map(w => (w.ID ? w.ID + " " : "") + val(w)).join("; ") || "—")}</div>
      <b>Products</b><div>${escHtml(products.join(", ") || "—")}</div>
    </div>
    ${notes ? `<h3>Notes</h3>${notes}` : ""}
    ${threats ? `<h3>Threats</h3>${threats}` : ""}
    ${rems ? `<h3>Remediations</h3>${rems}` : ""}
    <h3>Raw vulnerability object</h3>
    <pre>${escHtml(JSON.stringify(v, null, 2))}</pre>`;
}
function oracleDetailHtml(r) {
  const v = r._raw || {};
  const notes = (v.notes || []).map(n => `<div><b>${escHtml(n.title || n.category || "Note")}</b><div>${escHtml(n.text || "")}</div></div>`).join("");
  const rems = (v.remediations || []).map(x => `<div>${escHtml(x.details || "Vendor fix")}${x.url ? ` · <a href="${escHtml(x.url)}" target="_blank" rel="noopener">Oracle patch information</a>` : ""}</div>`).join("");
  const metricBits = Object.keys(r._metrics || {}).filter(Boolean).map(k => metricLabel(k, r._metrics[k])).join(" · ");
  return `
    <div class="detail-grid">
      <b>CVE</b><div><a href="https://www.oracle.com/security-alerts/" target="_blank" rel="noopener">${escHtml(r["CVE-ID"])}</a>
        · <a href="https://nvd.nist.gov/vuln/detail/${encodeURIComponent(r["CVE-ID"])}" target="_blank" rel="noopener">NVD</a></div>
      <b>Description</b><div>${escHtml(r._fullDescription || r.Description)}</div>
      <b>CVSS</b><div>${escHtml(r.CVSS)} — <span class="vector">${escHtml(r["CVSS Vector"])}</span></div>
      <b>Metrics</b><div>${escHtml(metricBits || "Not provided")}</div>
      <b>Impact / Auto / Expl</b><div>${escHtml(r.Impact)} · Automatable ${escHtml(r.Automatable)} · Exploitation ${escHtml(r.Exploitation)} · Internet ${escHtml(r["Internet Exposed"])}</div>
      <b>Product families</b><div>${escHtml((r._families || []).join(", ") || "—")}</div>
      <b>Affected products</b><div>${escHtml((r._products || []).join("; ") || "—")}</div>
    </div>
    ${notes ? `<h3>Oracle notes</h3>${notes}` : ""}
    ${rems ? `<h3>Remediations</h3>${rems}` : ""}
    <h3>Raw vulnerability object</h3>
    <pre>${escHtml(JSON.stringify(v, null, 2))}</pre>`;
}
function escHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function render() {
  filtered.sort((x, y) => {
    if (sortCol === "CVSS") return (parseFloat(x.CVSS || 0) - parseFloat(y.CVSS || 0)) * sortDir;
    return String(x[sortCol] || "").localeCompare(String(y[sortCol] || "")) * sortDir;
  });
  $body.innerHTML = "";
  filtered.forEach(r => {
    const tr = document.createElement("tr");
    tr.className = "main-row" + (openCve === r["CVE-ID"] ? " open" : "");
    tr.onclick = () => {
      openCve = openCve === r["CVE-ID"] ? null : r["CVE-ID"];
      render();
    };
    COLS.forEach(c => {
      const td = document.createElement("td");
      const valx = r[c] || "";
      if (c === "CVE-ID") {
        const a = document.createElement("span");
        a.className = "cve-link";
        a.textContent = valx;
        td.appendChild(a);
      } else if (c === "CVSS Vector") {
        td.className = "vector";
        td.textContent = valx;
      } else if (["Severity","Impact","Automatable","Internet Exposed","Exploitation"].includes(c) && valx) {
        const b = document.createElement("span");
        b.className = "badge " + String(valx).toUpperCase();
        b.textContent = valx;
        td.appendChild(b);
      } else td.textContent = valx;
      tr.appendChild(td);
    });
    $body.appendChild(tr);
    if (openCve === r["CVE-ID"]) {
      const dr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = COLS.length;
      td.className = "detail";
      td.innerHTML = detailHtml(r);
      dr.appendChild(td);
      $body.appendChild(dr);
    }
  });
  $("#stats").textContent = `Showing ${filtered.length} of ${rows.length}`;
  const dis = filtered.length === 0;
  $("#exportCsvBtn").disabled = $("#exportXlsBtn").disabled = $("#exportJsonBtn").disabled = $("#copyBtn").disabled = dis;
}
function toCSV(data) {
  const esc = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  return [COLS.join(",")].concat(data.map(r => COLS.map(c => esc(r[c])).join(","))).join("\n");
}
function dl(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}
function exportStem() { return activeVendor === "oracle" ? `oracle_${$("#oracleRelease").value || "release"}` : "patch_pre_release"; }
function dlCSV(data) { dl(exportStem() + ".csv", new Blob([toCSV(data)], { type: "text/csv" })); }
function dlJSON(data) {
  const clean = data.map(r => { const o = {}; COLS.forEach(c => o[c] = r[c]); return o; });
  dl(exportStem() + ".json", new Blob([JSON.stringify(clean, null, 2)], { type: "application/json" }));
}
function dlXLS(data) {
  let html = "<table><tr>" + COLS.map(c => `<th>${c}</th>`).join("") + "</tr>";
  data.forEach(r => { html += "<tr>" + COLS.map(c => `<td>${r[c] || ""}</td>`).join("") + "</tr>"; });
  dl(exportStem() + ".xls", new Blob([html + "</table>"], { type: "application/vnd.ms-excel" }));
}
async function loadFiles() {
  const j = $("#cvrf").files[0];
  if (!j) return alert("Select CVRF JSON");
  let json;
  try { json = JSON.parse(await readText(j)); }
  catch { return alert("Invalid JSON"); }
  rows = parseCVRF(json);
  vendorRows.microsoft = rows;
  openCve = null;
  buildHeader();
  filtered = rows.slice();
  render();
  const n = rows.filter(r => r.Exploitation === "active").length;
  $("#msg").textContent = `Loaded ${rows.length} CVEs. ${n} exploited. Click a CVE to expand details.`;
}

function switchVendor(vendor) {
  activeVendor = vendor;
  const oracle = vendor === "oracle";
  $("#microsoftTab").setAttribute("aria-selected", String(!oracle));
  $("#oracleTab").setAttribute("aria-selected", String(oracle));
  $("#microsoftInputs").classList.toggle("hidden", oracle);
  $("#oracleInputs").classList.toggle("hidden", !oracle);
  $("#loadBtn").classList.toggle("hidden", oracle);
  $("#pageTitle").textContent = oracle ? "Oracle Security Update SSVC Scoring Dashboard" : "Microsoft Patch Tuesday Pre-Release Dashboard";
  rows = vendorRows[vendor] || [];
  openCve = null;
  buildHeader();
  applyFilters();
  if (oracle && !oracleManifest) loadOracleManifest();
  else if (oracle && !rows.length && $("#oracleRelease").value) loadOracleRelease();
  $("#msg").textContent = rows.length ? `Loaded ${rows.length} CVEs. Click a CVE to expand details.` : "";
}
async function loadOracleManifest() {
  const select = $("#oracleRelease");
  try {
    const res = await fetch("oracle-data/releases.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    oracleManifest = await res.json();
    const releases = oracleManifest.releases || [];
    select.innerHTML = releases.map(r => `<option value="${escHtml(r.id)}">${escHtml(r.title)}</option>`).join("");
    select.disabled = !releases.length;
    if (!releases.length) throw new Error("No Oracle releases found");
    await loadOracleRelease();
  } catch (err) {
    select.innerHTML = "<option>Oracle data unavailable</option>";
    $("#msg").textContent = `Oracle data unavailable: ${err.message}. Run the Oracle refresh workflow once.`;
  }
}
async function loadOracleRelease() {
  const release = (oracleManifest?.releases || []).find(r => r.id === $("#oracleRelease").value);
  if (!release) return;
  $("#msg").textContent = `Loading ${release.title}…`;
  try {
    const res = await fetch(release.data, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    vendorRows.oracle = parseOracleCSAF(json);
    rows = vendorRows.oracle;
    openCve = null;
    const families = [...new Set(rows.flatMap(r => r._families || []))].sort();
    $("#oracleProduct").innerHTML = '<option value="">All products</option>' + families.map(x => `<option>${escHtml(x)}</option>`).join("");
    $("#oracleProduct").disabled = false;
    $("#oracleSource").href = release.advisory_url || "https://www.oracle.com/security-alerts/";
    buildHeader();
    applyFilters();
    $("#msg").textContent = `Loaded ${rows.length} affected CVEs from ${release.title}. Click a CVE to expand details.`;
  } catch (err) {
    rows = vendorRows.oracle = [];
    applyFilters();
    $("#msg").textContent = `Could not load ${release.title}: ${err.message}`;
  }
}
</script>
</body>
</html>
